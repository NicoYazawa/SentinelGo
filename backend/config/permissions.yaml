permissions:
  - path: "/api/v1/users"
    method: "GET"
    description: "获取用户列表"
  - path: "/api/v1/users"
    method: "POST"
    description: "创建用户"
  - path: "/api/v1/users/:id"
    method: "PUT"
    description: "更新用户"
  - path: "/api/v1/users/:id"
    method: "DELETE"
    description: "删除用户"
  - path: "/api/v1/users/:id/status"
    method: "PUT"
    description: "修改用户状态"
  - path: "/api/v1/users/:id/password"
    method: "PUT"
    description: "修改用户密码"
  - path: "/api/v1/users/:id/roles"
    method: "GET"
    description: "获取用户角色"
  - path: "/api/v1/users/:id/roles"
    method: "PUT"
    description: "分配用户角色"
  - path: "/api/v1/roles"
    method: "GET"
    description: "获取角色列表"
  - path: "/api/v1/roles"
    method: "POST"
    description: "创建角色"
  - path: "/api/v1/roles/:id"
    method: "PUT"
    description: "更新角色"
  - path: "/api/v1/roles/:id"
    method: "DELETE"
    description: "删除角色"
  - path: "/api/v1/roles/:id/menus"
    method: "GET"
    description: "获取角色菜单"
  - path: "/api/v1/roles/:id/menus"
    method: "PUT"
    description: "分配角色菜单"
  - path: "/api/v1/roles/:id/permissions"
    method: "GET"
    description: "获取角色权限"
  - path: "/api/v1/roles/:id/permissions"
    method: "PUT"
    description: "分配角色权限"
  - path: "/api/v1/menus"
    method: "GET"
    description: "获取菜单列表"
  - path: "/api/v1/menus"
    method: "POST"
    description: "创建菜单"
  - path: "/api/v1/menus/:id"
    method: "PUT"
    description: "更新菜单"
  - path: "/api/v1/menus/:id"
    method: "DELETE"
    description: "删除菜单"
  - path: "/api/v1/menus/tree"
    method: "GET"
    description: "获取菜单树"
  - path: "/api/v1/permissions"
    method: "GET"
    description: "获取权限列表"
  - path: "/api/v1/permissions"
    method: "POST"
    description: "创建权限"
  - path: "/api/v1/permissions/:id"
    method: "PUT"
    description: "更新权限"
  - path: "/api/v1/permissions/:id"
    method: "DELETE"
    description: "删除权限"
