name: Publish images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend, user-frontend]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Determine image name and validate version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          COMPONENT: ${{ matrix.directory }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected v1.0.0 or v1.0.0-rc.1'; exit 1
          fi
          echo "name=ghcr.io/${REPOSITORY,,}/${COMPONENT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.directory }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.directory }}
          cache-to: type=gha,mode=max,scope=${{ matrix.directory }}
